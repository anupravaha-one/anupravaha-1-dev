name: Auto-close external Pull Requests

# While the project is in preservation-only mode (no maintainer bandwidth for
# external contributions), any Pull Request from someone other than the
# admin is auto-commented and closed.
#
# Runs on `pull_request_target` so the GITHUB_TOKEN has write permission
# even for PRs from forks — we never check out PR code here, only call the
# REST API to comment and close, so this is safe.
#
# To re-open contributions later: just delete this file (or set the `if:` to
# `false`).

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    # Skip the auto-close for the admin's own PRs (useful for self-review
    # discipline). Update the username here if you change repo admins.
    if: github.event.pull_request.user.login != 'vatsalyasharma'

    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const message = [
              `Hi @${author} — thanks for your interest in Anupravaha-I!`,
              ``,
              `This repository is currently in **preservation-only mode**: maintainer bandwidth is limited, so external Pull Requests with bug fixes or new features **are not being accepted** right now. This PR is being closed automatically — no hard feelings.`,
              ``,
              `**The code remains yours to fork and modify** under GPL v3.0. The [How to fork & use guide](https://vatsalyasharma.gitlab.io/Anupravaha_1/source-code/how-to-fork-and-use/) walks through cloning your fork, building, and iterating on your own copy. You're free to keep modifications private, share them publicly under GPL v3.0, or publish results obtained with your version.`,
              ``,
              `If you've found a bug, please **open an [Issue](${context.payload.repository.html_url}/issues/new/choose)** instead — those are read and will be acted on when bandwidth permits.`,
              ``,
              `When contributions reopen, this auto-close policy will be removed and the website notice updated.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });
